substitutions:
  name: waveshare-40-p4-86-eth
  friendly_name: "Waveshare 4.0 P4"
  home_assistant_url: "http://homeassistant.local:8123/"

  # Wake word and VAD configuration
  wake_word_model_url: "http://homeassistant.local:8123/local/wake_words/your_model.json"
  wake_word_probability: "0.93"
  wake_word_sliding_window_size: "10"
  vad_model_url: "github://esphome/micro-wake-word-models/models/v2/vad.json@main"
  vad_probability_cutoff: "0.60"

## Modular version Main P4 v1.0.01-liminal
## SETTINGS ######################################################################################################################################

  imagewidth:  "720"
  imageheight: "720"

  screenwidth:  "720"
  screenheight: "720"
  rotate_display: "0"

  startup_sound: "available" # (options are: available, Home_Connected, Home_Connected_Male, Computer_Ready, videogames, respect-and-enjoy-the-peace)
  clock_background_image: "tron" # (options are: clock, hacker, mission, Rolex, starrysky, waves, tron, chip, waterdrops, foundation)
  imagemodel: "Luffy" # options are:
# Alita, Alfred, Astrobot, Buzz, Casita, Cybergirl, Dory, EVE, Eyes, Eyes2, GLaDOS, Girl1, Guy1, Guy2, Gwen, HA-character, ha-girl, Hacker, Harley,
# Jarvis, Luffy, Mario, Max, Prime, Robochibi, Robocop, Robot, Robotgirl, Shaun

# USE ONLINE OR LOCAL MODEL AND WALLPAPER IMAGES, IMAGES SHOULD BE PLACED IN: homeassistant/www/images/
  imagepath: "https://github.com/1liminal1/xiaozhi-esphome/raw/main/images"
#  imagepath: "http://homeassistant.local:8123/local/images/"

## PRESENCE / MOTION SENSORS ########## IF NOT USING THESE LEAVE THEM ALONE, SCRIPT WILL BREAK WITHOUT ###########################################

  sensor1_entity: "binary_sensor.your_sensor_1"
  sensor1_label: "Room 1"
  sensor2_entity: "binary_sensor.your_sensor_2"
  sensor2_label: "Room 2"
  sensor3_entity: "binary_sensor.your_sensor_3"
  sensor3_label: "Room 3"
  sensor4_entity: "binary_sensor.your_sensor_4"
  sensor4_label: "Room 4"
  sensor5_entity: "binary_sensor.your_sensor_5"
  sensor5_label: "Room 5"
  weather_entity: "weather.forecast_home"

## LIGHTS ########################################################################################################################################

  light1_entity: "light.your_light_1"
  light2_entity: "light.your_light_2"
  light3_entity: "light.your_light_3"
  light4_entity: "light.your_light_4"
  light5_entity: "light.your_light_5"

##################################################################################################################################################

  font_glyphsets: "GF_Latin_Core"
  font_family: Figtree

esp32:
  board: esp32-p4-evboard
  flash_size: 32Mb
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

api:
  encryption:
    key: "your-api-encryption-key"

### USE MODULES FROM GITHUB (default) ############################################################################################################

packages:
  core:
    url: https://github.com/1liminal1/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/core.yaml
  hw:
    url: https://github.com/1liminal1/xiaozhi-esphome.git
    ref: main
    refresh: 0s
    files:
      - devices/Under_Development/Modular/HW/waveshare-40-p4-86-eth_hw.yaml
#  spotify:
#    url: https://github.com/1liminal1/xiaozhi-esphome.git
#    ref: main
#    refresh: 0s
#    files:
#      - devices/Under_Development/Modular/spotify.yaml

### USE LOCAL MODULES (read description https://github.com/1liminal1/xiaozhi-esphome/blob/main/devices/Under_Development/Modular/README.md) #######

#packages: # Local
#  core: !include localtest/core.yaml
#  hw:   !include localtest/HW/waveshare-40-p4-86-eth_hw.yaml

## ENABLE / DISABLE WAKE WORDS ## IF LOW ON MEMORY, USE LESS WAKE WORDS ##########################################################################

micro_wake_word:
  id: mww
  models:
    - okay_nabu
    - hey_jarvis
